<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ver Filmes</title>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    header {
      margin-bottom: 20px;
    }
    .filme {
      background-color: #1f1f1f;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    iframe, video {
      width: 100%;
      max-width: 600px;
      height: 340px;
      border: none;
      margin-top: 10px;
    }
    .botoes {
      margin-top: 10px;
    }
    .botoes a {
      background-color: #00e676;
      color: black;
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      margin-right: 10px;
      display: inline-block;
    }
    
    /* Improved focus styles for accessibility */
    a:focus, button:focus, input:focus, [role="button"]:focus, .filme:focus-within {
      outline: 3px solid #2196F3;
      outline-offset: 2px;
    }
    /* Skip focus indicator on mouse interaction, only show for keyboard */
    :focus:not(:focus-visible) {
      outline: none;
    }
  </style>
</head>
<body>
<img src="https://cdn.glitch.global/70b10424-4387-474d-8d6e-56837fdf76e2/InShot_20250423_115514178.jpg?v=1745420235706" 
     width="1920" 
     height="468" 
     alt="Banner da plataforma de streaming" 
     style="display: block; width: 100%; max-width: 1920px; height: auto; margin: 0 auto;" />
  <header>
    <h1>Filmes Cadastrados</h1>
    <p>Para assistir em tela cheia abra o link e faça login no Google</p>
  </header>
  <main>
    <div id="listaFilmes" role="region" aria-label="Lista de filmes disponíveis"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC4THzGt-8NwPDmWuaqR4OTJR_6XbfbSvM",
      authDomain: "api7-5cde7.firebaseapp.com",
      databaseURL: "https://api7-5cde7-default-rtdb.firebaseio.com",
      projectId: "api7-5cde7",
      storageBucket: "api7-5cde7.appspot.com",
      messagingSenderId: "113015470459",
      appId: "1:113015470459:web:3ffd77031fb936d001a5de"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function gerarEmbed(link) {
      if (link.includes("drive.google.com")) {
        const match = link.match(/[-\w]{25,}/);
        if (match) {
          const fileId = match[0];
          return `<iframe src="https://drive.google.com/file/d/${fileId}/preview" allow="autoplay" title="Reprodutor de vídeo do Google Drive"></iframe>`;
        }
      }
      if (link.endsWith(".mp4")) {
        return `<video src="${link}" controls></video>`;
      }
      return `<iframe src="${link}" allow="autoplay" title="Reprodutor de vídeo"></iframe>`;
    }

    function carregarFilmes() {
      const lista = document.getElementById("listaFilmes");
      database.ref("filmes").once("value", snapshot => {
        const dados = snapshot.val();
        if (dados) {
          Object.values(dados).forEach(filme => {
            const div = document.createElement("div");
            div.className = "filme";
            div.setAttribute("role", "article");
            div.innerHTML = `
              <h2>${filme.titulo}</h2>
              ${gerarEmbed(filme.link)}
              <div class="botoes">
                <a href="${filme.link}" target="_blank">Abrir Link</a>
                <a href="https://wa.me/?text=Assista%20a%20${encodeURIComponent(filme.titulo)}%20em%20${encodeURIComponent(filme.link)}" target="_blank">Compartilhar no WhatsApp</a>
              </div>
            `;
            lista.appendChild(div);
          });
          // Focus will be handled naturally by the browser
        } else {
          lista.innerHTML = "<p>Nenhum filme cadastrado ainda.</p>";
        }
      });
    }

    // Instead of managing focus manually, we'll enhance the natural keyboard navigation
    document.addEventListener("keydown", e => {
      // Only handle arrow keys inside our movie list region
      if ((e.key === "ArrowDown" || e.key === "ArrowUp") && e.target.closest('#listaFilmes')) {
        const currentElement = document.activeElement;
        const movies = Array.from(document.querySelectorAll('.filme'));
        
        // Find the current and determine the next one to focus
        const currentIndex = movies.indexOf(currentElement.closest('.filme'));
        let nextIndex;
        
        if (e.key === "ArrowDown") {
          nextIndex = (currentIndex + 1) % movies.length;
          e.preventDefault();
        } else if (e.key === "ArrowUp") {
          nextIndex = (currentIndex - 1 + movies.length) % movies.length;
          e.preventDefault();
        }
        
        // Find the first focusable element in the next movie and focus it
        const nextMovie = movies[nextIndex];
        const firstFocusable = nextMovie.querySelector('a, button, input, select, textarea, [tabindex]:not([tabindex="-1"])');
        if (firstFocusable) {
          firstFocusable.focus();
        } else {
          // If no focusable element, make the movie container itself focusable temporarily
          nextMovie.setAttribute('tabindex', '-1');
          nextMovie.focus();
          // Remove the tabindex after focus
          setTimeout(() => nextMovie.removeAttribute('tabindex'), 100);
        }
      }
    });

    window.onload = carregarFilmes;
  </script>
</body>
</html>
