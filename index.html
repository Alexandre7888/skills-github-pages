<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ver Filmes</title>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .filme {
      background-color: #1f1f1f;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    iframe, video {
      width: 100%;
      max-width: 600px;
      height: 340px;
      border: none;
      margin-top: 10px;
    }
    .botoes {
      margin-top: 10px;
    }
    .botoes a {
      background-color: #00e676;
      color: black;
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      margin-right: 10px;
      display: inline-block;
    }

    /* Estilo de foco (borda azul) */
    .focused {
      outline: 3px solid cyan !important;
      border-radius: 10px;
    }
  </style>
</head>
<body>
<img src="https://cdn.glitch.global/70b10424-4387-474d-8d6e-56837fdf76e2/InShot_20250423_115514178.jpg?v=1745420235706" 
     width="1920" 
     height="468" 
     alt="Banner da plataforma de streaming" 
     style="display: block; width: 100%; max-width: 1920px; height: auto; margin: 0 auto;" />
  <h1>Filmes Cadastrados</h1>
  para assistir em tela cheia abra o link e faça login no Google
  <div id="listaFilmes"></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC4THzGt-8NwPDmWuaqR4OTJR_6XbfbSvM",
      authDomain: "api7-5cde7.firebaseapp.com",
      databaseURL: "https://api7-5cde7-default-rtdb.firebaseio.com",
      projectId: "api7-5cde7",
      storageBucket: "api7-5cde7.appspot.com",
      messagingSenderId: "113015470459",
      appId: "1:113015470459:web:3ffd77031fb936d001a5de"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function validateURL(url) {
      try {
        // Try to create a URL object - this will fail for invalid URLs
        const parsedUrl = new URL(url);
        
        // Special case for WhatsApp sharing
        if (parsedUrl.hostname === 'wa.me') {
          return true;
        }
        
        // Check if it's a valid protocol (only allow http, https)
        if (!['http:', 'https:'].includes(parsedUrl.protocol)) {
          return false;
        }
        
        // Validate against allowed domains (Google Drive and trusted domains)
        const trustedDomains = [
          'drive.google.com',
          'docs.google.com',
          'www.youtube.com',
          'youtube.com',
          'youtu.be',
          'wa.me',
          'vimeo.com',
          'player.vimeo.com'
          // Add more trusted domains as needed
        ];
        
        const isDomainTrusted = trustedDomains.some(domain => 
          parsedUrl.hostname === domain || parsedUrl.hostname.endsWith('.' + domain)
        );
        
        // For MP4 files, ensure they come from trusted sources
        if (parsedUrl.pathname.endsWith('.mp4')) {
          return isDomainTrusted;
        }
        
        return isDomainTrusted;
      } catch (e) {
        // URL parsing failed, likely invalid URL
        return false;
      }
    }
    
    // Test a URL against potentially malicious inputs
    function testURLSafety(url) {
      // Test for JavaScript protocol injection
      if (url.toLowerCase().startsWith('javascript:')) {
        return false;
      }
      
      // Test for data URI schemes
      if (url.toLowerCase().startsWith('data:')) {
        return false;
      }
      
      // Additional checks for XSS patterns
      const xssPatterns = [
        'onerror=',
        'javascript:',
        '<script',
        'onload=',
        'onclick=',
        'onmouseover='
      ];
      
      if (xssPatterns.some(pattern => url.toLowerCase().includes(pattern))) {
        return false;
      }
      
      return true;
    }
    
    function sanitizeString(str) {
      if (!str || typeof str !== 'string') return '';
      return DOMPurify.sanitize(str, {ALLOWED_TAGS: [], ALLOWED_ATTR: []});
    }
    
    function gerarEmbed(link) {
      // If link is not a string or is empty, return empty content
      if (!link || typeof link !== 'string') {
        return '';
      }
      
      // Validate URL before proceeding (both domain validation and safety checks)
      if (!validateURL(link) || !testURLSafety(link)) {
        console.error('Invalid or potentially unsafe URL:', link);
        return '<div class="error">Link inválido ou não permitido</div>';
      }
      
      if (link.includes("drive.google.com")) {
        const match = link.match(/[-\w]{25,}/);
        if (match) {
          const fileId = sanitizeString(match[0]);
          // Only allow embedding from Google Drive
          return DOMPurify.sanitize(
            `<iframe src="https://drive.google.com/file/d/${fileId}/preview" allow="autoplay" tabindex="0"></iframe>`,
            {ALLOWED_TAGS: ['iframe'], ALLOWED_ATTR: ['src', 'allow', 'tabindex']}
          );
        }
      }
      
      if (link.endsWith(".mp4")) {
        // Sanitize the video URL
        return DOMPurify.sanitize(
          `<video src="${link}" controls tabindex="0"></video>`,
          {ALLOWED_TAGS: ['video'], ALLOWED_ATTR: ['src', 'controls', 'tabindex']}
        );
      }
      
      // For all other URLs, sanitize and create an iframe with restricted attributes
      return DOMPurify.sanitize(
        `<iframe src="${link}" allow="autoplay" tabindex="0"></iframe>`,
        {ALLOWED_TAGS: ['iframe'], ALLOWED_ATTR: ['src', 'allow', 'tabindex']}
      );
    }

    function createSafeElement(tag, attributes = {}, content = '') {
      const element = document.createElement(tag);
      
      // Apply sanitized attributes
      Object.entries(attributes).forEach(([key, value]) => {
        if (key === 'href' || key === 'src') {
          // For href/src attributes, validate the URL first (both domain validation and safety checks)
          if (validateURL(value) && testURLSafety(value)) {
            element.setAttribute(key, value);
          } else {
            console.error(`Invalid ${key} URL:`, value);
            // Use a fallback or just don't set the attribute
            if (key === 'href') {
              element.setAttribute(key, '#');
            }
          }
        } else {
          // For other attributes, just sanitize the value
          element.setAttribute(key, sanitizeString(value));
        }
      });
      
      // Set content if provided
      if (content) {
        if (typeof content === 'string') {
          element.textContent = content; // Use textContent to prevent HTML injection
        } else if (content instanceof Node) {
          element.appendChild(content);
        }
      }
      
      return element;
    }
    
    function carregarFilmes() {
      const lista = document.getElementById("listaFilmes");
      database.ref("filmes").once("value", snapshot => {
        const dados = snapshot.val();
        if (dados) {
          Object.values(dados).forEach(filme => {
            // Create main container with DOM methods instead of innerHTML
            const div = document.createElement("div");
            div.className = "filme";
            div.setAttribute("tabindex", "0");
            
            // Create and append title
            const title = document.createElement("strong");
            title.textContent = sanitizeString(filme.titulo);
            div.appendChild(title);
            div.appendChild(document.createElement("br"));
            
            // Append embed content (already sanitized in gerarEmbed function)
            const embedContainer = document.createElement("div");
            embedContainer.innerHTML = gerarEmbed(filme.link);
            div.appendChild(embedContainer);
            
            // Create buttons container
            const botoesDiv = document.createElement("div");
            botoesDiv.className = "botoes";
            
            // Only create link buttons if the URL is valid
            if (validateURL(filme.link)) {
              // Create "Open Link" button safely
              const openLinkBtn = createSafeElement(
                'a', 
                {
                  'href': filme.link,
                  'target': '_blank',
                  'tabindex': '0'
                }, 
                'Abrir Link'
              );
              botoesDiv.appendChild(openLinkBtn);
              
              // Create WhatsApp sharing button safely
              const sanitizedTitulo = sanitizeString(filme.titulo);
              const whatsappURL = `https://wa.me/?text=Assista%20a%20${encodeURIComponent(sanitizedTitulo)}%20em%20${encodeURIComponent(filme.link)}`;
              
              if (validateURL(whatsappURL) && testURLSafety(whatsappURL)) {
                const shareBtn = createSafeElement(
                  'a',
                  {
                    'href': whatsappURL,
                    'target': '_blank',
                    'tabindex': '0'
                  },
                  'Compartilhar no WhatsApp'
                );
                botoesDiv.appendChild(shareBtn);
              }
            }
            
            div.appendChild(botoesDiv);
            lista.appendChild(div);
          });
          atualizarFoco();
        } else {
          lista.textContent = "Nenhum filme cadastrado ainda.";
        }
      });
    }

    let focusIndex = 0;

    function atualizarFoco() {
      const focaveis = document.querySelectorAll('[tabindex="0"]');
      focaveis.forEach(el => el.classList.remove("focused"));
      if (focaveis.length > 0) {
        const el = focaveis[focusIndex];
        el.classList.add("focused");
        el.focus();
      }
    }

    document.addEventListener("keydown", e => {
      const focaveis = document.querySelectorAll('[tabindex="0"]');
      if (e.key === "ArrowDown") {
        focusIndex = (focusIndex + 1) % focaveis.length;
        atualizarFoco();
        e.preventDefault();
      } else if (e.key === "ArrowUp") {
        focusIndex = (focusIndex - 1 + focaveis.length) % focaveis.length;
        atualizarFoco();
        e.preventDefault();
      } else if (e.key === "Enter") {
        focaveis[focusIndex]?.click?.();
      }
    });

    window.onload = carregarFilmes;
  </script>
</body>
</html>
